<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailor Measurement Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-DfEp1kpI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BJ7tvvTV.css">
  </head>
  <body>
    <div id="app">
      <div id="app-login" class="screen-only wrap" style="max-width: 420px; margin-top: 60px; padding-bottom: 40px;">
        <div class="card" style="position: relative;">
          <img src="./logo.jpg" alt="Adepam Card" style="height: 90px; margin: 0 auto 16px; display: block; border-radius: 8px;" />
          
          <div style="text-align: center; margin-bottom: 24px;">
            <h2 id="auth-title" class="group-title" style="margin-bottom: 8px; font-size: 26px;">Tailor Login</h2>
            <p id="auth-subtitle" style="color: var(--muted); font-size: 14px; margin: 0;"></p>
          </div>

          <div id="step-indicator" class="hide" style="display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
            <div id="step-1-circle" style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">1</div>
            <div id="step-line" style="height: 3px; width: 40px; background: var(--line);"></div>
            <div id="step-2-circle" style="width: 32px; height: 32px; border-radius: 50%; background: var(--line); color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">2</div>
          </div>
          
          <!-- STEP 1 FIELDS / SIGN IN -->
          <div id="wrap-step-1">
            <div id="signup-fields-1" class="hide">
              <label class="field" style="margin-bottom: 14px;">
                <span>Shop Name *</span>
                <input id="l-shop" type="text" placeholder="e.g. Adepam Atelier" />
              </label>
              <label class="field" style="margin-bottom: 14px;">
                <span>Full Name *</span>
                <input id="l-name" type="text" placeholder="John Doe" />
              </label>
            </div>
            
            <label class="field" style="margin-bottom: 14px;">
              <span id="l-email-label">Email Address *</span>
              <input id="l-email" type="email" placeholder="tailor@example.com" autocomplete="email" />
            </label>
            
            <div id="signup-fields-2" class="hide">
              <label class="field" style="margin-bottom: 14px;">
                <span>Phone Number</span>
                <input id="l-phone" type="tel" placeholder="+1234567890" />
              </label>
            </div>
          </div>

          <!-- STEP 2 FIELDS / PASSWORD -->
          <div id="wrap-step-2">
            <label id="wrap-password" class="field" style="margin-bottom: 14px;">
              <div style="display: flex; justify-content: space-between;">
                <span>Password *</span>
                <button type="button" id="btn-toggle-pwd" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;font-weight:500;">Show</button>
              </div>
              <input id="l-password" type="password" placeholder="••••••••" autocomplete="current-password" />
            </label>

            <div id="signup-fields-3" class="hide">
              <label class="field" style="margin-bottom: 14px;">
                <span>Confirm Password *</span>
                <input id="l-confirm-password" type="password" placeholder="••••••••" />
              </label>
            </div>
          </div>
          
          <div id="wrap-forgot" style="text-align: right; margin-bottom: 16px;">
            <button type="button" id="link-forgot" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;">Forgot password?</button>
          </div>
          
          <p id="login-error" class="error hide" role="alert" style="margin-bottom: 16px; font-size: 14px;"></p>
          <p id="login-msg" class="hide" role="status" style="margin-bottom: 16px; color: #1e8e3e; background: #e6f4ea; border-radius: 10px; padding: 10px 12px; font-size: 14px;"></p>
          
          <div id="action-signin" style="margin-bottom: 16px;">
            <button id="btn-signin" class="btn primary" type="button" style="width: 100%;">Sign In</button>
          </div>

          <div id="action-signup-1" class="hide" style="margin-bottom: 16px;">
            <button id="btn-next" class="btn primary" type="button" style="width: 100%;">Next Step &rarr;</button>
          </div>

          <div id="action-signup-2" class="hide" style="display: flex; gap: 10px; margin-bottom: 16px;">
            <button id="btn-back" class="btn ghost" type="button" style="flex: 1; background: var(--line); color: var(--ink); border: none;">&larr; Back</button>
            <button id="btn-signup" class="btn primary" type="button" style="flex: 1.5;">Create Account</button>
          </div>

          <div id="action-reset" class="hide" style="margin-bottom: 16px;">
            <button id="btn-reset" class="btn primary" type="button" style="width: 100%;">Send Reset Link</button>
          </div>
          
          <p style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted);">
            <span id="switch-text">New here?</span> 
            <button type="button" id="btn-switch" style="background:none;border:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0;">Create an account</button>
          </p>
        </div>
      </div>

      <div id="app-content" class="hide">
        <header class="screen-only top">
          <div class="wrap top-in">
            <div style="display: flex; align-items: center; gap: 16px;">
              <img src="./logo.jpg" alt="Adepam" style="height: 48px; border-radius: 4px;" />
              <div>
                <h1>Measurement Card</h1>
              </div>
            </div>
            <nav class="tabs" style="align-items: center;">
              <button id="tab-form" class="tab active" type="button">New Client</button>
              <button id="tab-saved" class="tab" type="button">Saved Clients <span id="count" class="badge">0</span></button>
              <button id="tab-profile" class="tab" type="button">My Profile</button>
            </nav>
          </div>
        </header>

      <main class="screen-only wrap">
        <section id="view-form">
          <div class="card">
            <h2 class="group-title">Customer</h2>
            <div class="grid-fields wide">
              <label class="field"><span>Date</span><input id="f-date" type="date" /></label>
              <label class="field"><span>Customer's Name</span><input id="f-name" type="text" placeholder="Full name" autocomplete="off" /></label>
              <label class="field"><span>Address / Tel</span><input id="f-contact" type="text" placeholder="Address or phone number" autocomplete="off" /></label>
              <label class="field"><span>Charge</span>
                <div class="prefix"><b>₵</b><input id="f-charge" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" /></div>
              </label>
            </div>
          </div>

          <div class="unit-row">
            <p>Measurements in <strong id="unit-note">inches</strong></p>
            <div class="seg">
              <button id="unit-in" type="button" class="active">in</button>
              <button id="unit-cm" type="button">cm</button>
            </div>
          </div>

          <div id="measure-groups"></div>

          <div class="card">
            <h2 class="group-title">Material &amp; Notes</h2>
            <label class="field"><span>Type of Material</span><textarea id="f-material" rows="2" placeholder="e.g. Ankara wax print, 6 yards"></textarea></label>
            <label class="field" style="margin-top: 14px"><span>Notes / Special Instructions</span><textarea id="f-notes" rows="4" placeholder="Extra tailoring details"></textarea></label>
          </div>

          <p id="form-error" class="error hide" role="alert"></p>
          <div class="actions">
            <button id="btn-save" class="btn primary" type="button">Save Profile</button>
            <button id="btn-print" class="btn" type="button">Print / Save PDF</button>
            <button id="btn-clear" class="btn ghost" type="button">Clear Form</button>
          </div>
        </section>

        <section id="view-saved" class="hide">
          <input id="search" class="search" type="search" placeholder="Search by name or phone" autocomplete="off" />
          <div id="saved-list" class="saved-list"></div>
          <p id="empty" class="empty hide"></p>
        </section>

        <section id="view-my-profile" class="hide">
          <div class="card" style="background: var(--accent); color: white; border: none; text-align: center; margin-bottom: 24px; padding: 32px 16px;">
            <div id="p-avatar" style="width: 64px; height: 64px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;">T</div>
            <h2 id="p-shop-name" style="margin: 0; font-size: 24px;">Shop Name</h2>
            <p id="p-full-name" style="margin: 4px 0 16px; opacity: 0.8; font-size: 14px;">Tailor Name</p>
            
            <div style="display: flex; gap: 16px; justify-content: center; background: rgba(0,0,0,0.1); border-radius: 12px; padding: 12px;">
              <div style="flex: 1;">
                <div style="font-size: 12px; opacity: 0.8; margin-bottom: 4px;">Total Clients</div>
                <div id="p-stat-clients" style="font-weight: bold; font-size: 18px;">0</div>
              </div>
              <div style="width: 1px; background: rgba(255,255,255,0.2);"></div>
              <div style="flex: 1;">
                <div style="font-size: 12px; opacity: 0.8; margin-bottom: 4px;">Measurements</div>
                <div id="p-stat-meas" style="font-weight: bold; font-size: 18px;">0</div>
              </div>
            </div>
          </div>

          <div class="card">
            <h2 class="group-title">Profile Information</h2>
            <div class="grid-fields wide">
              <label class="field" style="margin-bottom: 12px;">
                <span>Shop Name</span>
                <input id="p-input-shop" type="text" />
              </label>
              <label class="field" style="margin-bottom: 12px;">
                <span>Full Name</span>
                <input id="p-input-name" type="text" />
              </label>
              <label class="field" style="margin-bottom: 12px;">
                <span>Phone Number</span>
                <input id="p-input-phone" type="tel" />
              </label>
              <label class="field" style="margin-bottom: 16px;">
                <span>Email Address (Read-only)</span>
                <input id="p-input-email" type="email" disabled style="background: var(--bg); opacity: 0.7;" />
              </label>
              <button id="btn-update-profile" class="btn primary" type="button" style="width: 100%;">Update Profile</button>
            </div>
          </div>

          <div class="card" style="margin-top: 24px;">
            <h2 class="group-title">Change Password</h2>
            <div class="grid-fields wide">
              <label class="field" style="margin-bottom: 12px;">
                <span>New Password</span>
                <input id="p-input-pwd" type="password" placeholder="••••••••" />
              </label>
              <label class="field" style="margin-bottom: 16px;">
                <span>Confirm New Password</span>
                <input id="p-input-confirm" type="password" placeholder="••••••••" />
              </label>
              <button id="btn-update-password" class="btn" type="button" style="width: 100%;">Update Password</button>
            </div>
          </div>
          
          <div style="text-align: center; margin: 32px 0;">
            <button id="btn-logout" class="btn ghost sm" type="button" style="color: #d32f2f;">Logout from Adepam</button>
          </div>
        </section>
      </main>
      </div>

      <div id="print-sheet"></div>
      <div id="toast" class="toast" role="status"></div>
    </div>
  </body>
</html>
