<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="kente-pat" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f1c40f"/>
      <rect x="20" width="20" height="20" fill="#27ae60"/>
      <rect y="20" width="20" height="20" fill="#c0392b"/>
      <rect x="20" y="20" width="20" height="20" fill="#2980b9"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="#000" stroke-width="1" opacity="0.3"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="#000" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#1e130c"/>
  <!-- Toga / Stole Drape -->
  <path d="M100,80 Q200,60 300,80 L320,330 Q200,350 80,330 Z" fill="url(#kente-pat)" stroke="#aa820a" stroke-width="4"/>
  <!-- Diagonal Royal Wrap Across Body -->
  <path d="M90,110 Q180,180 310,240 L290,320 Q180,260 70,200 Z" fill="#aa820a" opacity="0.85"/>
  <text x="200" y="375" text-anchor="middle" fill="#f1c40f" font-family="'Inter', sans-serif" font-weight="600" font-size="14" letter-spacing="1.5">ROYAL CEREMONIAL KENTE</text>
</svg>
