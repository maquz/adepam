<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailor Measurement Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="app-login" class="screen-only wrap" style="max-width: 400px; margin-top: 100px;">
        <div class="card" style="text-align: center; position: relative;">
          <img src="/logo.jpg" alt="Adepam Card" style="height: 100px; margin: 0 auto 24px; display: block; border-radius: 8px;" />
          
          <h2 id="auth-title" class="group-title" style="margin-bottom: 16px;">Tailor Login</h2>
          
          <div id="wrap-signup-fields" class="hide">
            <label class="field" style="text-align: left; margin-bottom: 12px;">
              <span>Shop Name</span>
              <input id="l-shop" type="text" placeholder="e.g. Adepam Atelier" />
            </label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
              <label class="field" style="text-align: left;">
                <span>First Name</span>
                <input id="l-first" type="text" placeholder="John" />
              </label>
              <label class="field" style="text-align: left;">
                <span>Last Name</span>
                <input id="l-last" type="text" placeholder="Doe" />
              </label>
            </div>
            <label class="field" style="text-align: left; margin-bottom: 12px;">
              <span>Phone Number</span>
              <input id="l-phone" type="tel" placeholder="+1234567890" />
            </label>
          </div>

          <label class="field" style="text-align: left;">
            <span>Email</span>
            <input id="l-email" type="email" placeholder="tailor@example.com" autocomplete="email" />
          </label>
          
          <label id="wrap-password" class="field" style="text-align: left; margin-top: 12px;">
            <div style="display: flex; justify-content: space-between;">
              <span>Password</span>
              <button type="button" id="btn-toggle-pwd" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;">Show</button>
            </div>
            <input id="l-password" type="password" placeholder="••••••••" autocomplete="current-password" />
          </label>
          
          <div id="wrap-forgot" style="text-align: right; margin-top: 8px;">
            <button type="button" id="link-forgot" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;">Forgot password?</button>
          </div>
          
          <p id="login-error" class="error hide" role="alert" style="margin-top: 12px; text-align: left;"></p>
          <p id="login-msg" class="hide" role="status" style="margin-top: 12px; color: #1e8e3e; background: #e6f4ea; border-radius: 10px; padding: 10px 12px; text-align: left; font-size: 14px;"></p>
          
          <button id="btn-action" class="btn primary" type="button" style="width: 100%; margin-top: 16px;">Sign In</button>
          
          <p id="wrap-switch" style="margin-top: 16px; font-size: 14px; color: var(--muted);">
            <span id="switch-text">New here?</span> 
            <button type="button" id="btn-switch" style="background:none;border:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0;">Create an account</button>
          </p>
        </div>
      </div>

      <div id="app-content" class="hide">
        <header class="screen-only top">
          <div class="wrap top-in">
            <div style="display: flex; align-items: center; gap: 16px;">
              <img src="/logo.jpg" alt="Adepam" style="height: 48px; border-radius: 4px;" />
              <div>
                <h1>Measurement Card</h1>
              </div>
            </div>
            <nav class="tabs" style="align-items: center;">
              <button id="tab-form" class="tab active" type="button">New Profile</button>
              <button id="tab-saved" class="tab" type="button">Saved Clients <span id="count" class="badge">0</span></button>
              <button id="btn-logout" class="btn ghost sm" type="button" style="margin-left: 16px;">Logout</button>
            </nav>
          </div>
        </header>

      <main class="screen-only wrap">
        <section id="view-form">
          <div class="card">
            <h2 class="group-title">Customer</h2>
            <div class="grid-fields wide">
              <label class="field"><span>Date</span><input id="f-date" type="date" /></label>
              <label class="field"><span>Customer's Name</span><input id="f-name" type="text" placeholder="Full name" autocomplete="off" /></label>
              <label class="field"><span>Address / Tel</span><input id="f-contact" type="text" placeholder="Address or phone number" autocomplete="off" /></label>
              <label class="field"><span>Charge</span>
                <div class="prefix"><b>₵</b><input id="f-charge" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" /></div>
              </label>
            </div>
          </div>

          <div class="unit-row">
            <p>Measurements in <strong id="unit-note">inches</strong></p>
            <div class="seg">
              <button id="unit-in" type="button" class="active">in</button>
              <button id="unit-cm" type="button">cm</button>
            </div>
          </div>

          <div id="measure-groups"></div>

          <div class="card">
            <h2 class="group-title">Material &amp; Notes</h2>
            <label class="field"><span>Type of Material</span><textarea id="f-material" rows="2" placeholder="e.g. Ankara wax print, 6 yards"></textarea></label>
            <label class="field" style="margin-top: 14px"><span>Notes / Special Instructions</span><textarea id="f-notes" rows="4" placeholder="Extra tailoring details"></textarea></label>
          </div>

          <p id="form-error" class="error hide" role="alert"></p>
          <div class="actions">
            <button id="btn-save" class="btn primary" type="button">Save Profile</button>
            <button id="btn-print" class="btn" type="button">Print / Save PDF</button>
            <button id="btn-clear" class="btn ghost" type="button">Clear Form</button>
          </div>
        </section>

        <section id="view-saved" class="hide">
          <input id="search" class="search" type="search" placeholder="Search by name or phone" autocomplete="off" />
          <div id="saved-list" class="saved-list"></div>
          <p id="empty" class="empty hide"></p>
        </section>
      </main>
      </div>

      <div id="print-sheet"></div>
      <div id="toast" class="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
